server:
    interface: 127.0.0.1
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Aggressive cache
    cache-min-ttl: 300
    cache-max-ttl: 86400
    neg-cache-size: 4m
    msg-cache-size: 32m
    rrset-cache-size: 64m

    # Performance
    num-threads: 2
    prefetch: yes
    prefetch-key: yes

    # Privacy
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes

    # Without recursion; direct forward to ControlD
    do-not-query-localhost: no

forward-zone:
    name: "."
    forward-tls-upstream: no
    forward-addr: 76.76.2.1@53
    forward-addr: 76.76.10.1@53